<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Kas — Catatan Keuangan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22304A">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buku Kas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE6D3;
    --paper-line:#B9C4A8;
    --ink:#22304A;
    --ink-soft:#5B6478;
    --rule-red:#A6453B;
    --income:#3F6B4A;
    --pokok:#3B6EA5;
    --investasi:#B8862C;
    --darurat:#A6453B;
    --bebas:#4A8A82;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Work Sans',sans-serif;
    background:#DDD4BC;
    color:var(--ink);
    min-height:100vh;
    padding:20px 12px 60px;
  }
  .book{
    max-width:560px;
    margin:0 auto;
    background:var(--paper);
    border-radius:2px;
    box-shadow:0 12px 30px rgba(34,48,74,0.18), 0 1px 0 rgba(255,255,255,0.4) inset;
    position:relative;
    overflow:hidden;
  }
  .spine{
    position:absolute;
    top:0; bottom:0; left:38px;
    width:1px;
    background:var(--rule-red);
    opacity:0.5;
  }
  .book-inner{
    padding:28px 22px 28px 54px;
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:28px;
    margin:0 0 2px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0 0 20px;
    font-size:13px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
  }
  .balance-card{
    background:var(--ink);
    color:var(--paper);
    border-radius:6px;
    padding:18px 20px;
    margin-bottom:18px;
  }
  .balance-card .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    opacity:0.7;
    font-family:'Work Sans',sans-serif;
  }
  .balance-card .amount{
    font-family:'IBM Plex Mono',monospace;
    font-size:30px;
    font-weight:600;
    margin-top:4px;
    letter-spacing:-0.01em;
  }
  .sub-totals{
    display:flex;
    gap:14px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid rgba(237,230,211,0.2);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  .sub-totals div{flex:1;}
  .sub-totals .lbl{font-size:10px;opacity:0.65;text-transform:uppercase;letter-spacing:0.06em;}
  .io-row{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .io-btn{
    flex:1;
    padding:9px 8px;
    border:1px solid var(--paper-line);
    background:rgba(255,255,255,0.4);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:12px;
    border-radius:5px;
    cursor:pointer;
  }
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:14px;
  }
  .tab-btn{
    flex:1;
    padding:10px 8px;
    border:1px solid var(--paper-line);
    background:transparent;
    color:var(--ink-soft);
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:13px;
    border-radius:5px;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  form{
    display:none;
    flex-direction:column;
    gap:10px;
    margin-bottom:22px;
    padding:16px;
    background:rgba(255,255,255,0.35);
    border:1px solid var(--paper-line);
    border-radius:6px;
  }
  form.active{display:flex;}
  form label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-bottom:2px;
    display:block;
  }
  form input, form select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--paper-line);
    border-radius:4px;
    background:#fff;
    font-family:'Work Sans',sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  form button{
    margin-top:4px;
    padding:11px;
    border:none;
    border-radius:5px;
    background:var(--rule-red);
    color:#fff;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    font-family:'Work Sans',sans-serif;
  }
  form.pengeluaran button{background:var(--ink);}
  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
  }
  .cat-choice{
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:8px;
    font-size:12px;
    text-align:center;
    cursor:pointer;
    background:#fff;
    font-weight:600;
    color:var(--ink-soft);
  }
  .cat-choice.selected{
    color:#fff;
  }
  .cat-choice[data-cat="pokok"].selected{background:var(--pokok);border-color:var(--pokok);}
  .cat-choice[data-cat="investasi"].selected{background:var(--investasi);border-color:var(--investasi);}
  .cat-choice[data-cat="darurat"].selected{background:var(--darurat);border-color:var(--darurat);}
  .cat-choice[data-cat="bebas"].selected{background:var(--bebas);border-color:var(--bebas);}

  h2.section-title{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 10px;
    border-bottom:1px solid var(--paper-line);
    padding-bottom:6px;
  }
  .cat-summary{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:22px;
  }
  .cat-row{font-size:13px;}
  .cat-row-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:4px;
    font-family:'IBM Plex Mono',monospace;
  }
  .cat-row-top .name{font-family:'Work Sans',sans-serif;font-weight:600;}
  .bar-track{
    height:6px;
    background:rgba(34,48,74,0.1);
    border-radius:3px;
    overflow:hidden;
  }
  .bar-fill{height:100%;border-radius:3px;}
  .bar-fill.pokok{background:var(--pokok);}
  .bar-fill.investasi{background:var(--investasi);}
  .bar-fill.darurat{background:var(--darurat);}
  .bar-fill.bebas{background:var(--bebas);}

  .tx-list{display:flex;flex-direction:column;}
  .tx-header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--paper-line);
    padding-bottom:6px;
    margin-bottom:10px;
    gap:8px;
  }
  .period-select{
    font-family:'Work Sans',sans-serif;
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:5px 8px;
    background:#fff;
    max-width:52%;
  }
  .month-group{margin-bottom:18px;}
  .month-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    background:rgba(34,48,74,0.06);
    border-radius:5px;
    padding:8px 10px;
    margin-bottom:6px;
  }
  .month-header .month-name{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:15px;
  }
  .month-header .month-stats{
    text-align:right;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .month-header .month-stats .out{color:var(--rule-red);}
  .month-header .month-stats .in{color:var(--income);}
  .tx-icon{
    width:34px;height:34px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:14px;
    font-family:'Work Sans',sans-serif;
    flex-shrink:0;
  }
  .tx-icon.income{background:var(--income);}
  .tx-icon.pokok{background:var(--pokok);}
  .tx-icon.investasi{background:var(--investasi);}
  .tx-icon.darurat{background:var(--darurat);}
  .tx-icon.bebas{background:var(--bebas);}
  .tx-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px dashed var(--paper-line);
    font-size:13px;
    gap:10px;
  }
  .tx-main{display:flex;align-items:center;gap:10px;min-width:0;}
  .tx-left{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .tx-name{font-weight:600;font-size:13.5px;color:var(--ink);}
  .tx-cat{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-weight:600;
  }
  .tx-cat.income{color:var(--income);}
  .tx-cat.pokok{color:var(--pokok);}
  .tx-cat.investasi{color:var(--investasi);}
  .tx-cat.darurat{color:var(--darurat);}
  .tx-cat.bebas{color:var(--bebas);}
  .tx-note{color:var(--ink-soft);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tx-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .tx-amount{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .tx-amount.income{color:var(--income);}
  .tx-amount.expense{color:var(--rule-red);}
  .tx-date{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);}
  .del-btn{
    background:none;border:none;color:var(--ink-soft);
    font-size:16px;cursor:pointer;padding:2px 4px;line-height:1;
  }
  .empty{
    text-align:center;
    padding:30px 10px;
    color:var(--ink-soft);
    font-size:13px;
    font-style:italic;
  }
</style>
</head>
<body>
<div class="book">
  <div class="spine"></div>
  <div class="book-inner">
    <header>
      <h1>Buku Kas</h1>
      <p id="today-label">—</p>
    </header>

    <div class="balance-card">
      <div class="label">Saldo Saat Ini</div>
      <div class="amount" id="balance-amount">Rp0</div>
      <div class="sub-totals">
        <div>
          <div class="lbl">Pemasukan</div>
          <div id="total-income">Rp0</div>
        </div>
        <div>
          <div class="lbl">Pengeluaran</div>
          <div id="total-expense">Rp0</div>
        </div>
      </div>
    </div>

    <div class="io-row">
      <button type="button" class="io-btn" id="export-btn">⬇ Export Data</button>
      <button type="button" class="io-btn" id="import-btn">⬆ Import Data</button>
      <input type="file" id="import-file" accept="application/json" style="display:none;">
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="pemasukan">+ Pemasukan</button>
      <button class="tab-btn" data-tab="pengeluaran">+ Pengeluaran</button>
    </div>

    <form id="form-pemasukan" class="pemasukan active">
      <div>
        <label>Sumber</label>
        <select id="income-source">
          <option value="Gaji">Gaji</option>
          <option value="Bonus">Bonus</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>
      <div>
        <label>Jumlah (Rp)</label>
        <input type="text" inputmode="numeric" id="income-amount" placeholder="0">
      </div>
      <div>
        <label>Catatan (opsional)</label>
        <input type="text" id="income-note" placeholder="mis. Gaji bulan Agustus">
      </div>
      <div>
        <label>Tanggal</label>
        <input type="date" id="income-date">
      </div>
      <button type="submit">Simpan Pemasukan</button>
    </form>

    <form id="form-pengeluaran" class="pengeluaran">
      <div>
        <label>Kategori</label>
        <div class="cat-grid">
          <div class="cat-choice selected" data-cat="pokok">Kebutuhan Pokok</div>
          <div class="cat-choice" data-cat="investasi">Investasi</div>
          <div class="cat-choice" data-cat="darurat">Dana Darurat</div>
          <div class="cat-choice" data-cat="bebas">Uang Bebas</div>
        </div>
      </div>
      <div>
        <label>Jumlah (Rp)</label>
        <input type="text" inputmode="numeric" id="expense-amount" placeholder="0">
      </div>
      <div>
        <label>Catatan (opsional)</label>
        <input type="text" id="expense-note" placeholder="mis. Belanja bulanan">
      </div>
      <div>
        <label>Tanggal</label>
        <input type="date" id="expense-date">
      </div>
      <button type="submit">Simpan Pengeluaran</button>
    </form>

    <h2 class="section-title">Ringkasan per Kategori</h2>
    <div class="cat-summary" id="cat-summary"></div>

    <div class="tx-header-row">
      <h2 class="section-title" style="border:none;margin:0;padding:0;">Riwayat Transaksi</h2>
      <select id="period-filter" class="period-select"></select>
    </div>
    <div class="tx-list" id="tx-list"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'buku-kas-transaksi-v1';
const CAT_LABELS = {
  pokok: 'Kebutuhan Pokok',
  investasi: 'Investasi',
  darurat: 'Dana Darurat',
  bebas: 'Uang Bebas'
};

let transactions = load();

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    return [];
  }
}
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
    return true;
  }catch(e){
    return false;
  }
}
function formatRp(n){
  return 'Rp' + Math.round(n).toLocaleString('id-ID');
}
function formatDate(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'});
}
function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function parseAmount(raw){
  // Terima input dengan titik/koma/spasi sebagai pemisah ribuan, hanya ambil digitnya
  const digits = raw.replace(/[^0-9]/g, '');
  return digits ? parseInt(digits, 10) : NaN;
}
// Auto-format tampilan saat mengetik jumlah (pemisah ribuan)
function attachAmountFormatting(input){
  input.addEventListener('input', ()=>{
    const digits = input.value.replace(/[^0-9]/g, '');
    input.value = digits ? Number(digits).toLocaleString('id-ID') : '';
  });
}
attachAmountFormatting(document.getElementById('income-amount'));
attachAmountFormatting(document.getElementById('expense-amount'));

document.getElementById('today-label').textContent =
  new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
document.getElementById('income-date').value = todayStr();
document.getElementById('expense-date').value = todayStr();

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('form-pemasukan').classList.toggle('active', btn.dataset.tab === 'pemasukan');
    document.getElementById('form-pengeluaran').classList.toggle('active', btn.dataset.tab === 'pengeluaran');
  });
});

// Category picker
let selectedCat = 'pokok';
document.querySelectorAll('.cat-choice').forEach(el=>{
  el.addEventListener('click', ()=>{
    document.querySelectorAll('.cat-choice').forEach(c=>c.classList.remove('selected'));
    el.classList.add('selected');
    selectedCat = el.dataset.cat;
  });
});

// Forms
document.getElementById('form-pemasukan').addEventListener('submit', e=>{
  e.preventDefault();
  const amount = parseAmount(document.getElementById('income-amount').value);
  if(!amount || amount <= 0){
    alert('Isi jumlah pemasukan dengan angka lebih dari 0 dulu ya.');
    return;
  }
  transactions.push({
    id: Date.now(),
    type: 'income',
    source: document.getElementById('income-source').value,
    note: document.getElementById('income-note').value.trim(),
    amount,
    date: document.getElementById('income-date').value || todayStr()
  });
  document.getElementById('income-amount').value = '';
  document.getElementById('income-note').value = '';
  const saved = save();
  render();
  if(!saved) warnStorageIssue();
});

document.getElementById('form-pengeluaran').addEventListener('submit', e=>{
  e.preventDefault();
  const amount = parseAmount(document.getElementById('expense-amount').value);
  if(!amount || amount <= 0){
    alert('Isi jumlah pengeluaran dengan angka lebih dari 0 dulu ya.');
    return;
  }
  transactions.push({
    id: Date.now(),
    type: 'expense',
    category: selectedCat,
    note: document.getElementById('expense-note').value.trim(),
    amount,
    date: document.getElementById('expense-date').value || todayStr()
  });
  document.getElementById('expense-amount').value = '';
  document.getElementById('expense-note').value = '';
  const saved = save();
  render();
  if(!saved) warnStorageIssue();
});

let storageWarned = false;
function warnStorageIssue(){
  if(storageWarned) return;
  storageWarned = true;
  alert('Catatan tersimpan untuk sesi ini, tapi browser memblokir penyimpanan permanen di sini. Data bisa hilang kalau halaman ditutup. Coba buka file ini lewat Chrome/Safari langsung (bukan lewat aplikasi chat/pratinjau).');
}

function deleteTx(id){
  transactions = transactions.filter(t => t.id !== id);
  save();
  render();
}

// Export: unduh semua transaksi sebagai file JSON
document.getElementById('export-btn').addEventListener('click', ()=>{
  if(transactions.length === 0){
    alert('Belum ada data untuk di-export.');
    return;
  }
  const blob = new Blob([JSON.stringify(transactions, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayStr().replace(/-/g,'');
  a.href = url;
  a.download = `buku-kas-export-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

// Import: pilih file JSON hasil export sebelumnya
document.getElementById('import-btn').addEventListener('click', ()=>{
  document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{
      data = JSON.parse(reader.result);
    }catch(err){
      alert('File tidak valid. Pastikan ini file export dari Buku Kas (.json).');
      e.target.value = '';
      return;
    }
    if(!Array.isArray(data)){
      alert('Format file tidak dikenali.');
      e.target.value = '';
      return;
    }
    const valid = data.filter(t => t && (t.type === 'income' || t.type === 'expense') && typeof t.amount === 'number' && t.date);
    if(valid.length === 0){
      alert('Tidak ada transaksi valid di file ini.');
      e.target.value = '';
      return;
    }
    const replace = confirm(
      `File ini berisi ${valid.length} transaksi.\n\nOK = GANTI semua data saat ini dengan isi file.\nBatal = GABUNGKAN dengan data yang sudah ada (tanpa duplikat).`
    );
    if(replace){
      transactions = valid;
    }else{
      const existingIds = new Set(transactions.map(t => t.id));
      valid.forEach(t => {
        if(!existingIds.has(t.id)){
          transactions.push(t);
        }
      });
    }
    save();
    render();
    alert('Import selesai.');
    e.target.value = '';
  };
  reader.readAsText(file);
});

function render(){
  const income = transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const balance = income - expense;

  document.getElementById('balance-amount').textContent = formatRp(balance);
  document.getElementById('total-income').textContent = formatRp(income);
  document.getElementById('total-expense').textContent = formatRp(expense);

  // Category summary
  const catTotals = {pokok:0, investasi:0, darurat:0, bebas:0};
  transactions.filter(t=>t.type==='expense').forEach(t=>{
    if(catTotals[t.category] !== undefined) catTotals[t.category] += t.amount;
  });
  const maxExpenseTotal = expense > 0 ? expense : 1;
  const catSummaryEl = document.getElementById('cat-summary');
  catSummaryEl.innerHTML = Object.keys(CAT_LABELS).map(cat=>{
    const val = catTotals[cat];
    const pct = expense > 0 ? Math.round((val / maxExpenseTotal) * 100) : 0;
    return `
      <div class="cat-row">
        <div class="cat-row-top">
          <span class="name">${CAT_LABELS[cat]}</span>
          <span>${formatRp(val)} · ${pct}%</span>
        </div>
        <div class="bar-track"><div class="bar-fill ${cat}" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join('');

  // Filter periode + kelompokkan per bulan (seperti riwayat transaksi mobile banking)
  populatePeriodOptions();
  const period = document.getElementById('period-filter').value || 'all';
  const filtered = period === 'all'
    ? transactions
    : transactions.filter(t => t.date.slice(0,7) === period);

  const sorted = [...filtered].sort((a,b)=> b.date.localeCompare(a.date) || b.id - a.id);
  const listEl = document.getElementById('tx-list');
  if(sorted.length === 0){
    listEl.innerHTML = '<div class="empty">Belum ada transaksi untuk periode ini.</div>';
    return;
  }

  // Kelompokkan berdasarkan bulan (YYYY-MM)
  const groups = {};
  sorted.forEach(t=>{
    const key = t.date.slice(0,7);
    if(!groups[key]) groups[key] = [];
    groups[key].push(t);
  });

  const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  listEl.innerHTML = Object.keys(groups).sort().reverse().map(key=>{
    const [y,m] = key.split('-');
    const monthLabel = `${monthNames[parseInt(m,10)-1]} ${y}`;
    const rows = groups[key];
    const monthIn = rows.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const monthOut = rows.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);

    const rowsHtml = rows.map(t=>{
      const isIncome = t.type === 'income';
      const catClass = isIncome ? 'income' : t.category;
      const catLabel = isIncome ? (t.source || 'Pemasukan') : CAT_LABELS[t.category];
      const initial = catLabel.charAt(0).toUpperCase();
      const noteHtml = t.note ? `<span class="tx-note">${escapeHtml(t.note)}</span>` : '';
      const timeLabel = formatDateTime(t.date, t.id);
      return `
        <div class="tx-row">
          <div class="tx-main">
            <div class="tx-icon ${catClass}">${initial}</div>
            <div class="tx-left">
              <span class="tx-name">${escapeHtml(catLabel)}</span>
              <span class="tx-cat ${catClass}">${isIncome ? 'Pemasukan' : 'Pengeluaran'}</span>
              ${noteHtml}
              <span class="tx-date">${timeLabel}</span>
            </div>
          </div>
          <div class="tx-right">
            <span class="tx-amount ${isIncome ? 'income' : 'expense'}">${isIncome ? '+' : '-'}${formatRp(t.amount)}</span>
            <button class="del-btn" onclick="deleteTx(${t.id})" aria-label="Hapus transaksi">✕</button>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="month-group">
        <div class="month-header">
          <span class="month-name">${monthLabel}</span>
          <span class="month-stats">
            <span class="out">Keluar: ${formatRp(monthOut)}</span><br>
            <span class="in">Masuk: ${formatRp(monthIn)}</span>
          </span>
        </div>
        ${rowsHtml}
      </div>
    `;
  }).join('');
}

// Isi opsi dropdown filter periode berdasarkan bulan yang ada datanya
function populatePeriodOptions(){
  const sel = document.getElementById('period-filter');
  const currentValue = sel.value;
  const monthNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const monthsSet = new Set(transactions.map(t => t.date.slice(0,7)));
  const months = Array.from(monthsSet).sort().reverse();
  let optionsHtml = '<option value="all">Semua Transaksi</option>';
  optionsHtml += months.map(key=>{
    const [y,m] = key.split('-');
    return `<option value="${key}">${monthNames[parseInt(m,10)-1]} ${y}</option>`;
  }).join('');
  sel.innerHTML = optionsHtml;
  // pertahankan pilihan sebelumnya kalau masih ada di daftar
  if(currentValue && (currentValue === 'all' || months.includes(currentValue))){
    sel.value = currentValue;
  }
}
document.getElementById('period-filter').addEventListener('change', render);

// Ambil jam dari waktu pembuatan transaksi (id = timestamp), tanggal dari field date
function formatDateTime(dateStr, id){
  const dateLabel = formatDate(dateStr);
  const created = new Date(id);
  if(isNaN(created.getTime())) return dateLabel;
  const timeLabel = created.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
  return `${dateLabel}, ${timeLabel}`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
